[package]
name = "pathtrial"
version = "1.2.0-rc.1"
edition = "2021"
rust-version = "1.84"
description = "Evidence-first network diagnostics CLI"
license = "MIT"
repository = "https://github.com/example/pathtrial"
readme = "README.md"
keywords = ["network", "diagnostics", "tcp", "tls", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
rustls-native-certs = "0.8"
x509-parser = "0.16"
libc = "0.2"

[dev-dependencies]
jsonschema = "0.26"
rcgen = "0.13"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
