name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          name="pathtrial-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/pathtrial" "dist/${name}/"
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          shasum -a 256 "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256" 2>/dev/null \
            || sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          cp "dist/${name}.tar.gz" "dist/pathtrial-${{ matrix.target }}.tar.gz"
          shasum -a 256 "dist/pathtrial-${{ matrix.target }}.tar.gz" \
            > "dist/pathtrial-${{ matrix.target }}.tar.gz.sha256" 2>/dev/null \
            || sha256sum "dist/pathtrial-${{ matrix.target }}.tar.gz" \
              > "dist/pathtrial-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          find release -type f -exec cp {} assets/ \;
          cp scripts/install.sh assets/install.sh
          chmod +x assets/install.sh
          sha256sum assets/install.sh > assets/install.sh.sha256
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in
            *-rc.*|*-beta.*|*-alpha.*) prerelease="--prerelease" ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --clobber
          else
            gh release create "$tag" assets/* --title "$tag" \
              --generate-notes $prerelease
          fi
