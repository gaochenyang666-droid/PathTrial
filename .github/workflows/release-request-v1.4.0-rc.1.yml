name: one-time v1.4.0-rc.1 release request

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-request-v1.4.0-rc.1.yml"

permissions:
  contents: write
  actions: write

jobs:
  request-release:
    if: >-
      github.repository == 'gaochenyang666-droid/PathTrial' &&
      github.event.head_commit.message == 'release: request v1.4.0-rc.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CI, create immutable release tag, dispatch native build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v1.4.0-rc.1
          TARGET_SHA=073e814c9896f2f16732df7541f5c7c802fc6e98
          version=$(git show "$TARGET_SHA:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)
          test "$version" = "1.4.0-rc.1"
          git show "$TARGET_SHA:scripts/install.sh" | grep -F 'VERSION="${PATHTRIAL_VERSION:-v1.4.0-rc.1}"'
          git merge-base --is-ancestor "$TARGET_SHA" "$GITHUB_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists; refusing to move it." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing duplicate." >&2
            exit 1
          fi

          # This exact Git tree passed the full three-platform PR CI.
          # The release merge commit has identical tracked content.
          TESTED_SHA=1ec1f7999a681352c6551c5595a4e9cfae6611a5
          TESTED_RUN=39148374800
          target_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$TARGET_SHA" --jq '.tree.sha')
          tested_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$TESTED_SHA" --jq '.tree.sha')
          test "$target_tree" = "$tested_tree" || { echo "Merge tree differs from tested PR." >&2; exit 1; }
          run_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq '.head_sha')
          run_result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" --jq '.conclusion')
          test "$run_sha" = "$TESTED_SHA" && test "$run_result" = success \
            || { echo "Verified PR CI is not successful for the expected SHA." >&2; exit 1; }
          checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_SHA/check-runs?per_page=100")
          for check in 'test (ubuntu-24.04)' 'test (macos-15)' 'test (macos-15-intel)'; do
            printf '%s' "$checks" | jq -e --arg check "$check" \
              '[.check_runs[] | select(.name == $check and .conclusion == "success")] | length > 0' > /dev/null \
              || { echo "Missing successful $check" >&2; exit 1; }
          done

          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$TARGET_SHA" >/dev/null
          # Events created with GITHUB_TOKEN do not trigger push workflows:
          # explicit workflow_dispatch on the tag runs the existing release.yml.
          gh workflow run release.yml --ref "$TAG"
          echo "Requested native three-platform prerelease build for $TAG."
