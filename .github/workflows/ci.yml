name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test library
        timeout-minutes: 6
        run: cargo test --locked --lib -- --test-threads=1 --nocapture
      - name: Test CLI
        timeout-minutes: 6
        run: cargo test --locked --test cli -- --test-threads=1 --nocapture
      - name: Test collect
        timeout-minutes: 6
        run: cargo test --locked --test collect -- --test-threads=1 --nocapture
      - name: Test QUIC
        timeout-minutes: 6
        run: cargo test --locked --test quic -- --test-threads=1 --nocapture
      - name: Test golden and schema
        timeout-minutes: 6
        run: |
          cargo test --locked --test golden -- --test-threads=1
          cargo test --locked --test schema -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked
      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/pathtrial --version
          ./target/release/pathtrial --help > /dev/null
          ./target/release/pathtrial endpoint --udp-echo --bind 127.0.0.1:39001 &
          endpoint_pid=$!
          trap 'kill "$endpoint_pid" 2>/dev/null || true' EXIT
          sleep 2
          ./target/release/pathtrial udp --target 127.0.0.1:39001 --rounds 3 \
            --timeout-ms 1000 --format json > udp.json
          kill "$endpoint_pid" 2>/dev/null || true
          python3 -c "import json; d=json.load(open('udp.json')); assert d['status']=='PASS', d['status']"
          python3 - <<'PY'
          import json
          import subprocess
          schema = json.loads(subprocess.check_output(["./target/release/pathtrial", "schema"]))
          assert schema["$id"].startswith("https://pathtrial.dev/schemas/report-")
          PY
      - name: Report binary size
        shell: bash
        run: |
          ls -lh target/release/pathtrial
          size=$(stat -f%z target/release/pathtrial 2>/dev/null || stat -c%s target/release/pathtrial)
          echo "binary bytes: $size"
